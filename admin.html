<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AZURIA Admin</title><link rel="stylesheet" href="assets/style.css"></head><body>
<div class="admin-wrap"><div class="panel" id="loginPanel"><h1>لوحة إدارة AZURIA</h1><p>كلمة المرور التجريبية: <b>azuria2026</b></p><input class="field" id="password" type="password" placeholder="كلمة المرور"><button class="btn" id="login">دخول</button></div>
<div id="admin" style="display:none"><div class="panel"><h2>إعدادات المتجر</h2><div class="grid2"><input class="field" id="wa" placeholder="رقم واتساب بصيغة دولية"><input class="field" id="ann" placeholder="الشريط العلوي"><input class="field" id="hero" placeholder="عنوان البانر"><input class="field" id="heroTextAdmin" placeholder="نص البانر"></div><button class="btn" onclick="saveSettings()">حفظ الإعدادات</button></div>
<div class="panel"><h2>إضافة منتج</h2><div class="grid2"><input class="field" id="pName" placeholder="اسم المنتج"><input class="field" id="pBrand" placeholder="البراند"><input class="field" id="pCat" placeholder="القسم"><input class="field" id="pPrice" type="number" placeholder="السعر"><input class="field" id="pOld" type="number" placeholder="السعر القديم"><input class="field" id="pShade" placeholder="الدرجات"><input class="field" id="pBadge" placeholder="شارة: جديد / عرض"><input class="field" id="pStock" type="number" placeholder="الكمية"></div><button class="btn" onclick="addP()">إضافة المنتج</button></div>
<div class="panel"><h2>المنتجات</h2><div style="overflow:auto"><table class="admin-table"><thead><tr><th>المنتج</th><th>البراند</th><th>السعر</th><th>المخزون</th><th>الإجراء</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="panel"><h2>الطلبات</h2><div style="overflow:auto"><table class="admin-table"><thead><tr><th>رقم الطلب</th><th>الاسم</th><th>المجموع</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody id="orders"></tbody></table></div></div><a href="index.html">العودة للمتجر</a></div></div>
<script src="assets/admin.js"></script></body></html>
